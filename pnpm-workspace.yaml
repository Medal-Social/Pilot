packages:
  - "packages/*"
  - "packages/plugins/*"
allowBuilds:
  esbuild: true

# Transitive-only advisories: nothing here is declared directly, so an override is
# the only way to move them. Each is pinned to the first patched version, not latest,
# to stay inside the consumer's existing major.
overrides:
  shell-quote: 1.10.0   # GHSA-w7jw-789q-3m8p (critical), GHSA-395f-4hp3-45gv
  fast-uri: 3.1.6       # GHSA-v2hh-gcrm-f6hx, GHSA-7p8r-x3mc-p8w7 (ajv needs ^3)
  ink>ws: 8.21.3        # GHSA-96hv-2xvq-fx4p - ink bundles its own ws and that copy ships
  react-devtools-core>ws: 7.5.13  # same advisory on the 7.x line (dev only)
  js-yaml: 4.3.2        # GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj (via changesets)
  smol-toml: 1.8.0      # GHSA via knip; matches the CLI direct dep
  # vitest 4.1.11 still resolves an older vite/postcss/nanoid/esbuild internally.
  # Test-tooling only - nothing here reaches the published CLI.
  vite: 8.3.0
  postcss: 8.5.23
  nanoid: 3.3.18
  esbuild: 0.28.2
