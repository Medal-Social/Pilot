name: Auto Approve

# pull_request_target is required to approve with an App token. This workflow
# never checks out or runs PR code. It acts only on PRs opened by the workflows'
# own app (`medal-approvals`, the APP_ID identity) on an allow-listed branch
# pair: the release PR (changeset-release/prod → prod) and the back-merge PR
# (chore/backmerge-prod-into-dev-after-* → dev). Promotion PRs (dev → prod)
# are not listed on purpose so a human still decides when a release goes out.
#
# The approval comes from a second app (`medal-social-release-bot`) because
# GitHub does not let an app approve its own pull request.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches: [dev, prod]

permissions: {}

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    # Allow-list of exact head/base pairs the release workflow produces.
    # Anything else the app opens, including promotion PRs, waits for a human.
    if: |
      github.event.pull_request.user.login == 'medal-approvals[bot]' &&
      (
        (github.event.pull_request.base.ref == 'prod' &&
          github.event.pull_request.head.ref == 'changeset-release/prod') ||
        (github.event.pull_request.base.ref == 'dev' &&
          startsWith(github.event.pull_request.head.ref, 'chore/backmerge-prod-into-dev-after-'))
      )
    steps:
      - name: Generate reviewer token from the release-bot app
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v4
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: hmarr/auto-approve-action@8f929096a962e83ccdfa8afcf855f39f12d4dac7 # v4
        with:
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
